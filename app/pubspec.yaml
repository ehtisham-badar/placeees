name: trace
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  app_links: ^7.2.1
  camera: ^0.12.1
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  flutter_compass: ^0.8.1
  flutter_image_compress: ^2.5.1
  flutter_local_notifications: ^22.3.1
  flutter_map: ^8.3.2
  flutter_secure_storage: ^11.2.0
  flutter_timezone: ^5.1.1
  geolocator: ^14.1.1
  google_fonts: ^6.3.3
  google_sign_in: ^7.2.0
  home_widget: ^0.10.0
  http: ^1.6.0
  image_picker: ^1.2.3
  intl: ^0.20.3
  latlong2: ^0.10.1
  mobile_scanner: ^7.4.2
  native_geofence: ^1.3.1
  permission_handler: ^13.0.2
  provider: ^6.1.5+1
  sensors_plus: ^7.1.1
  shared_preferences: ^2.5.5
  sign_in_with_apple: ^8.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#0A0C11"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
